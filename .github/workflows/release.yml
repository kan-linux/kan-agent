name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v0.0.5)'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish (defaults to tag; use only for release recovery)'
        required: false
        type: string
      ggml_hexagon_ref:
        description: 'ggml-hexagon ref to build (branch, tag or commit; defaults to its default branch)'
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Keep the public GitHub Release publication last. The package is staged in a
  # draft release first; cleanup removes the draft if later publishing fails.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
      GGML_HEXAGON_REF: ${{ github.event.inputs.ggml_hexagon_ref || 'self-build-jz' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      # The release tree assembles llama-server and its runtime libraries from this
      # build output (build.sh's ./ggml-hexagon layout convention).
      - name: Checkout ggml-hexagon
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kan-linux/ggml-hexagon
          ref: ${{ env.GGML_HEXAGON_REF }}
          path: ggml-hexagon
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Node also builds the ggml-hexagon chat UI (its build runs `npm build`).
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build wget xz-utils glslc libvulkan-dev spirv-headers

      # Downloads the LunarG Vulkan SDK into prebuilts/ on first run; build.sh
      # then finds libvulkan.so.1 there.
      - name: Build ggml-hexagon
        run: |
          set -euo pipefail
          cd ggml-hexagon
          ./scripts/build-run-ggmlvulkan-x86-linux.sh build

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build workspace packages
        run: npm run build

      - name: Check tag matches the package version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*"version": "\(.*\)",\{0,1\}$/\1/p' packages/kan-agent/package.json | head -1)"
          if [ "v${VERSION}" != "${RELEASE_TAG}" ]; then
            echo "::error::tag ${RELEASE_TAG} does not match packages/kan-agent/package.json version ${VERSION}"
            exit 1
          fi

      # check + tests + release tree + tarball + selftest (the local release command).
      - name: Build and package
        run: ./build.sh ci

      - name: Stage release assets
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          TARBALL="kan-agent-${VERSION}-linux-x86_64.tar.gz"
          HEXAGON_SHA="$(git -C ggml-hexagon rev-parse HEAD)"
          test -f "out/${TARBALL}"
          mkdir -p release-assets
          cp "out/${TARBALL}" release-assets/
          {
            printf '%s\n' \
              "kan-agent ${VERSION} (linux-x86_64)" \
              "" \
              "Install:" \
              "  sudo tar -xzf ${TARBALL} -C /opt/" \
              "  /opt/kan-agent/kan-agent --help" \
              "" \
              "Layout: kan-agent CLI, config/ (component catalog), bin/ (llama-server + bundled" \
              "libraries). Place exactly one .gguf model in llm/ - models are not shipped." \
              "" \
              "Built from ggml-hexagon ${HEXAGON_SHA}."
          } > release-assets/RELEASE_NOTES.md
          cd release-assets
          sha256sum "${TARBALL}" > SHA256SUMS

      - name: Upload GitHub release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  stage-github-release:
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download GitHub release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Validate GitHub release payload
        run: |
          set -euo pipefail
          cd release-assets
          VERSION="${RELEASE_TAG#v}"
          TARBALL="kan-agent-${VERSION}-linux-x86_64.tar.gz"
          for asset in "${TARBALL}" SHA256SUMS RELEASE_NOTES.md; do
            test -f "${asset}"
          done
          sha256sum -c SHA256SUMS

      - name: Create draft GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd release-assets
          VERSION="${RELEASE_TAG#v}"
          release_assets=(
            "kan-agent-${VERSION}-linux-x86_64.tar.gz"
            SHA256SUMS
          )

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published. Refusing to mutate a public release."
            exit 1
          fi
          if [[ "${existing_release}" == "true" ]]; then
            gh release delete "${RELEASE_TAG}" --yes
          fi

          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --draft \
            --title "${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${release_assets[@]}"

          expected_asset_names="$(printf '%s\n' "${release_assets[@]}" | sort)"
          actual_asset_names="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual_asset_names}" != "${expected_asset_names}" ]]; then
            echo "::error::Draft GitHub Release asset set does not match expected files."
            diff -u <(printf '%s\n' "${expected_asset_names}") <(printf '%s\n' "${actual_asset_names}") || true
            exit 1
          fi

  publish-github-release:
    runs-on: ubuntu-latest
    needs:
      - stage-github-release
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Publish staged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" == "" ]]; then
            echo "::error::Draft GitHub Release ${RELEASE_TAG} does not exist."
            exit 1
          fi
          if [[ "${existing_release}" == "false" ]]; then
            echo "::error::GitHub Release ${RELEASE_TAG} is already published."
            exit 1
          fi

          gh release edit "${RELEASE_TAG}" --draft=false

  cleanup-draft-github-release:
    runs-on: ubuntu-latest
    needs:
      - stage-github-release
      - publish-github-release
    if: ${{ always() && needs.stage-github-release.result != 'skipped' && (needs.stage-github-release.result != 'success' || needs.publish-github-release.result != 'success') }}
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Delete draft GitHub Release after failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_release="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "${existing_release}" != "true" ]]; then
            exit 0
          fi

          gh release delete "${RELEASE_TAG}" --yes
